# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Sync Downstream

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      repositories:
        description: "Comma-separated repositories or auto"
        required: false
        default: "auto"

permissions: {}

jobs:
  sync:
    name: Sync Downstream Repositories
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app]
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install: false
          cache: false
      - name: Install copier
        run: mise install uv copier
      - name: Update downstream copier repositories
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
          SELF_REPO: ${{ github.repository }}
          REPOS_INPUT: ${{ inputs.repositories || 'auto' }}
          SCAFFOLD_WORKSPACE: ${{ github.workspace }}
        run: |
          gh auth setup-git

          if [ "$REPOS_INPUT" = "auto" ]; then
            mapfile -t repos < <(gh api --paginate "orgs/${ORG}/repos?type=all&per_page=100" --jq '.[] | select(.archived == false) | .full_name')
          else
            IFS=',' read -ra raw_repos <<< "$REPOS_INPUT"
            repos=()
            for item in "${raw_repos[@]}"; do
              trimmed=$(printf '%s' "$item" | xargs)
              if [ -z "$trimmed" ]; then
                continue
              fi
              case "$trimmed" in
                */*) repos+=("$trimmed") ;;
                *) repos+=("${ORG}/${trimmed}") ;;
              esac
            done
          fi

          work_root=$(mktemp -d)
          trap 'rm -rf "$work_root"' EXIT

          for repo in "${repos[@]}"; do
            if [ "$repo" = "$SELF_REPO" ]; then
              continue
            fi

            if ! answers=$(gh api -H "Accept: application/vnd.github.raw" "repos/${repo}/contents/.copier-answers.yml" 2>/dev/null); then
              continue
            fi

            if ! printf '%s\n' "$answers" | grep -Eq '^_src_path:.*scaffold'; then
              continue
            fi

            target="${work_root}/repo"
            rm -rf "$target"
            if ! git clone "https://github.com/${repo}.git" "$target"; then
              echo "failed to clone ${repo}, skipping"
              continue
            fi

            (
              cd "$target"
              git config user.name "taitide-release-bot[bot]"
              git config user.email "taitide-release-bot[bot]@users.noreply.github.com"
              branch="chore/sync-scaffold"
              git checkout -B "$branch"

              if ! mise x -C "$SCAFFOLD_WORKSPACE" -- copier update --trust --defaults --conflict=rej --quiet "$target"; then
                echo "copier update failed for ${repo}, skipping"
                exit 0
              fi

              if find . -name '*.rej' -not -path './.git/*' | grep -q .; then
                echo "conflicts detected in ${repo}, skipping"
                exit 0
              fi

              sed -i 's|^_src_path: gh:taitide-labs/scaffold$|_src_path: https://github.com/taitide-labs/scaffold.git|' .copier-answers.yml

              if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
                echo "no updates for ${repo}"
                exit 0
              fi

              git add -A
              git commit -m "chore(infra): 同步 scaffold 模板更新"
              git push -f origin "$branch"

              existing=$(gh pr list --repo "$repo" --head "$branch" --state open --json number --jq '.[0].number // empty')
              if [ -z "$existing" ]; then
                gh pr create \
                  --repo "$repo" \
                  --head "$branch" \
                  --title "chore(infra): 同步 scaffold 模板更新" \
                  --body $'## 变更说明\n\n自动同步 `taitide-labs/scaffold` 最新模板更新。'
              fi
            )
          done
